# The server as a long-running service.
#
#   docker compose up -d --build                    the server, on http://localhost:3579
#   docker compose --profile sugoi up -d --build    …and a Sugoi translator beside it (see tools/sugoi/README.md)
#   docker compose logs -f server                   the first start downloads the models before it listens
#
# Settings come from server/.env, the same file a run from source reads, so one file describes both. Anything that
# should differ only in the container goes in .env.docker beside this file, which is read second and wins.
# Neither file has to exist: without them the server starts on its defaults.

services:
  server:
    build: ./server
    # The build only carries onnxruntime's and sharp's libraries for x64; elsewhere this runs under emulation
    platform: linux/amd64
    image: manga-reader-server
    container_name: manga-reader
    restart: unless-stopped
    ports:
      # Loopback by default, as the server itself is. MANGA_READER_BIND=0.0.0.0 opens it to the network — plain http,
      # so passwords and session cookies cross it in clear; put TLS in front for anything beyond a home LAN.
      # A host port other than 3579 also needs WEBAUTHN_ORIGIN set to match, or passkeys refuse the origin.
      - "${MANGA_READER_BIND:-127.0.0.1}:${MANGA_READER_PORT:-3579}:3579"
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env.docker
        required: false
    environment:
      # Fixed for the container whatever the env files say: it must listen on every interface inside it (the port
      # mapping above decides who can reach that), on the port the mapping points at, and keep what it writes in the
      # volume below. Paths in the env files should stay relative and under ./data (as .env.example's are): the
      # working directory is /app, so ./data/… is the volume, and anything elsewhere is lost with the container.
      HOST: 0.0.0.0
      PORT: "3579"
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      # The database, page folders, logs, the secret key and the models. A named volume by default; set
      # MANGA_READER_DATA=./server/data to use the folder a run from source has been filling (stop that run first —
      # two servers on one SQLite database will tread on each other)
      - ${MANGA_READER_DATA:-manga-reader-data}:/app/data

  # Optional, research-use-only translator; nothing starts it unless the profile is asked for. The server finds it
  # once .env.docker says SUGOI_URL=http://sugoi:14366 — set only when this runs, since `auto` prefers Sugoi whenever
  # an address is configured.
  sugoi:
    profiles: [sugoi]
    build: ./tools/sugoi
    image: manga-reader-sugoi
    restart: unless-stopped
    # No published port: only the server talks to it, over the compose network
    volumes: ["sugoi-models:/models"]
    environment:
      SUGOI_DEVICE: cpu
      SUGOI_BEAM_SIZE: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:14366/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

volumes:
  manga-reader-data:
  sugoi-models:
