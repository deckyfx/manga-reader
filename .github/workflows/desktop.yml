name: Desktop

# Its own workflow, not a job beside the others, and deliberately so: the desktop companion is half-finished and
# expected to fail from time to time. Kept apart, a broken desktop tells you it is broken without also telling you
# the server is — which is the only way a red mark stays worth reading.
on:
  push:
    branches: [main]
    paths: ["desktop/**", "MangaReader.slnx", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "MangaReader.slnx", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build the Avalonia companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # The project targets net10.0; quality: preview lets this resolve before the release channel has it
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/MangaReaderDesktop.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: manga-reader-desktop
          path: desktop/bin/Release/net10.0/
          retention-days: 14
