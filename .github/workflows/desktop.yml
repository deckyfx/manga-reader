name: Desktop

# Its own workflow, not a job beside the others, and deliberately so: the desktop companion is half-finished and
# expected to fail from time to time. Kept apart, a broken desktop tells you it is broken without also telling you
# the server is — which is the only way a red mark stays worth reading. Tag `desktop-v1.2.3` to build one.
# Actions are pinned to commit SHAs with their tag beside them: a tag can be moved to point at other code, a commit
# cannot. Raise one by replacing the SHA, not by trusting the tag.

# Nothing here needs to write to the repository except the release jobs, which ask for it themselves.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: ["desktop/**", "MangaReader.slnx", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", "MangaReader.slnx", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  check:
    name: Build the Avalonia companion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # The project targets net10.0, which has been generally available since November 2025
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/MangaReaderDesktop.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release

  release:
    name: Publish a build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('desktop/MangaReaderDesktop.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Framework-dependent and linux-x64: whoever runs it needs the .NET runtime, which is the honest arrangement
      # until somebody decides this app is finished enough to ship self-contained
      - name: Publish
        run: dotnet publish --configuration Release --runtime linux-x64 --self-contained false -o publish

      - name: Pack it
        run: tar -czf "manga-reader-desktop-linux-x64.tar.gz" -C publish .

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag name may contain $(…) or backticks, and a workflow expression is pasted into the script before the
          # shell sees it — so the tag arrives as an environment variable, where the shell will not run it.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" manga-reader-desktop-linux-x64.tar.gz --title "$TAG" --generate-notes --repo "$REPO" || gh release upload "$TAG" manga-reader-desktop-linux-x64.tar.gz --clobber --repo "$REPO"
