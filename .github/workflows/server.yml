name: Server

# The server is the part everything else talks to, so it is checked on every change to it — and on changes to this
# workflow, because a pipeline that is never exercised is a pipeline nobody can trust.
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, test, and build something that runs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: the version this was developed and verified against. Raise it deliberately, not by drift.
          bun-version: 1.4.2

      - name: Cache installed packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('server/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # The tests point DATA_DIR at a scratch folder, so nothing here downloads a model
      - run: bun test

      - name: Build the executable and its archive
        run: bun run build --archive

      # The check that matters. Four separate things — sharp's binding, pino's transports, the shared libraries, a
      # metadata polyfill — were invisible to every test and only appeared when somebody ran the binary. The doctor
      # exits non-zero when something would stop the server, so this catches that class before a release does.
      - name: Unpack the archive elsewhere and ask it how it is
        run: |
          mkdir -p /tmp/unpacked
          tar -xzf dist/manga-reader-ubuntu64.tar.gz -C /tmp/unpacked --strip-components=1
          cd /tmp/unpacked
          ./app --doctor

      - uses: actions/upload-artifact@v4
        with:
          name: manga-reader-ubuntu64
          path: server/dist/manga-reader-ubuntu64.tar.gz
          retention-days: 14
