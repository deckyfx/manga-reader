reviews:
  path_instructions:
    - path: "{README.md,server/.env.example,server/src/env.ts,server/src/plugins/auth/**,server/src/services/auth.ts,extension/src/**,extension/static/**}"
      instructions: |
        Plain http during development is intentional and accepted: the server defaults to 127.0.0.1, and the
        developer runs it with HOST=0.0.0.0 over plain http on their own LAN to test from other devices. Do not flag
        cleartext transport (CWE-319) or ask for TLS to be required or enforced on that basis. The guards already
        in place are deliberate: the docs say plain http is for development and a real deployment needs TLS in
        front (TRUST_PROXY for the proxy's forwarded scheme); session cookies are marked Secure over https; and
        the extension only sends its API key to a plain-http non-loopback server after the user ticks
        allowInsecureServer. Do flag a change that weakens one of those guards.
    - path: "server/{src/services/page-pipeline.ts,src/shared/typeset.ts,client/studio/text/**,client/studio/canvas/**}"
      instructions: |
        Lettering areas are stored UNSHIFTED on purpose. `PageBlock.area` / `page_blocks.area_json` hold the
        bubble interior (or a sound effect's own box) exactly as found by `findAreas`, before any user move.
        The block's style carries the move separately: `style.offset` (moves the found area, keeping its shape)
        or `style.box` (an explicit rectangle). Both the burn (`render`: `shiftArea(found, style.offset)` or
        `rectArea(style.box)`) and the Studio preview (`buildLettering`: the same on the stored area) apply the
        style on top of the stored area, so preview and burn stay identical. The canvas turns a drag into an
        offset relative to the stored area's bound (`item.baseBox`), and "Back to bubble" clears the offset/box
        to return to the stored interior.
        Do NOT suggest persisting the shifted or boxed area into `b.area`: the preview would apply the offset
        twice, successive drags would accumulate, and resetting to the bubble would stop working. This is
        covered by the in-process test "burn shifts the found area by the offset (stored area stays unshifted)".
    - path: "server/src/db/migrations/**"
      instructions: |
        Migrations are committed, embedded into `src/db/migrations-embedded.ts` and applied on startup. NEVER
        suggest editing or deleting a migration that may already have run: changing its text changes its hash,
        and the startup guard then refuses to start with "the database has N migration(s) this build does not
        recognise". Corrections belong in a new migration.
        `PRAGMA foreign_keys` inside a migration is a no-op, because Drizzle runs each migration in a
        transaction. `MigrationManager.applyMigrations` turns foreign keys off around the whole run and checks
        `foreign_key_check` afterwards; that is what makes the table rebuilds safe, so don't move it back.
